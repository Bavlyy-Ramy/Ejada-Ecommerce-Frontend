<div class="login-page">
  <div class="brand-header">
    <h1>Products</h1>
    <span class="tag">Inventory Access</span>
  </div>

  <form class="login-card" (ngSubmit)="onSubmit()">
    <div class="barcode"></div>
    <div class="card-content">
      <h2>Sign in</h2>
      <p class="subtitle">Enter your credentials to access the catalog.</p>

      <div class="form-group">
        <label for="username">USERNAME</label>
        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="customer1"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">PASSWORD</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="alert-box error" *ngIf="errorMessage">
        <span class="alert-dot"></span> {{ errorMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        {{ isLoading ? 'Authenticating...' : 'Sign in' }}
      </button>

      <p class="switch-link">
        Don't have an account? <a routerLink="/register">Create account</a>
      </p>
    </div>
  </form>
</div>
