<div class="register-page">
  <div class="brand-header">
    <h1>Products</h1>
    <span class="tag">New Customer Register</span>
  </div>

  <form class="register-card" (ngSubmit)="onSubmit()">
    <div class="barcode"></div>
    <div class="card-content">
      <h2>Create Account</h2>
      <p class="subtitle">Fill in your details to register as a new customer.</p>

      <div class="form-row">
        <div class="form-group">
          <label for="firstName">FIRST NAME</label>
          <input id="firstName" type="text" name="firstName" [(ngModel)]="firstName" placeholder="Bavly" required />
        </div>
        <div class="form-group">
          <label for="lastName">LAST NAME</label>
          <input id="lastName" type="text" name="lastName" [(ngModel)]="lastName" placeholder="Ramy" required />
        </div>
      </div>

      <div class="form-group">
        <label for="email">EMAIL ADDRESS</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="bavly@example.com" required />
      </div>

      <div class="form-group">
        <label for="username">USERNAME</label>
        <input id="username" type="text" name="username" [(ngModel)]="username" placeholder="bavlyramy" required />
      </div>

      <div class="form-group">
        <label for="password">PASSWORD</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="••••••••" required />
      </div>

      <div class="alert-box error" *ngIf="errorMessage">
        <span class="alert-dot"></span> {{ errorMessage }}
      </div>

      <div class="alert-box success" *ngIf="successMessage">
        <span class="alert-dot"></span> {{ successMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating account...' : 'Create account' }}
      </button>

      <p class="switch-link">
        Already have an account? <a routerLink="/login">Sign in</a>
      </p>
    </div>
  </form>
</div>
